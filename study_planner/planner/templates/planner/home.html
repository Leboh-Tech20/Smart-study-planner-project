<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Study Planner | Home</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #d1c4e9, #b3e5fc);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            backdrop-filter: blur(12px);
            background: linear-gradient(135deg, #d1c4e9, #b3e5fc);
            border-radius: 24px;
            padding: 50px 40px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 420px;
            width: 90%;
        }

        .card h1 {
            font-size: 2.2rem;
            color: #2e3a59;
            margin-bottom: 12px;
        }

        .card p {
            color: #37474f; 
            font-size: 1rem;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .buttons a {
            padding: 14px 0;
            text-decoration: none;
            font-weight: 600; 
            background-color: #062aa3; 
            color: white;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(76, 175, 80, 0.3);
        }

        .buttons a:hover {
            background-color: #062aa3;
            transform: scale(1.03);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📖</div>
        <h1>Study Planner</h1>
        <p>Master your time. Crush your goals. Let's get started.</p>
        <div class="buttons">
            <a href="{% url 'login' %}">Login</a>
                
        </div>
    </div>
</body>
</html>
